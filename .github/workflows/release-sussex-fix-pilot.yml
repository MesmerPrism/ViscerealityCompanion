name: Release Sussex Fix Pilot

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pilot semantic version without a leading v (example: 0.1.80)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-pilot:
    runs-on: windows-2025-vs2026
    env:
      PACKAGE_ID: MesmerPrism.ViscerealityCompanionSussexFixPilot
      PACKAGE_DISPLAY_NAME: Viscereality Companion Sussex Fix Pilot
      PACKAGE_PUBLISHER_DISPLAY_NAME: Mesmer Prism
      PACKAGE_FILE_NAME: ViscerealityCompanion-SussexFixPilot.msix
      SETUP_FILE_NAME: ViscerealityCompanion-SussexFixPilot-Setup.exe
      APPINSTALLER_FILE_NAME: ViscerealityCompanion-SussexFixPilot.appinstaller
      CERTIFICATE_FILE_NAME: ViscerealityCompanion-SussexFixPilot.cer

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Resolve immutable pilot release identity
        id: release
        shell: pwsh
        run: |
          $semVer = '${{ inputs.version }}'
          if ($semVer -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 0.1.80, got $semVer"
          }

          $tagName = "sussex-fixed-pilot-v$semVer"
          $packageVersion = "$semVer.0"
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/$tagName"

          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "appinstaller_uri=$baseUrl/$env:APPINSTALLER_FILE_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_uri=$baseUrl/$env:PACKAGE_FILE_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "certificate_uri=$baseUrl/$env:CERTIFICATE_FILE_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_page_uri=https://github.com/${{ github.repository }}/releases/tag/$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Reject an existing pilot tag or release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release view $env:PILOT_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Pilot release $env:PILOT_TAG already exists. Pilot assets are immutable; choose a new version."
          }

          git ls-remote --exit-code --tags origin "refs/tags/$env:PILOT_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Pilot tag $env:PILOT_TAG already exists. Refusing to replace or retarget it."
          }

      - name: Validate signing configuration
        shell: pwsh
        env:
          WINDOWS_PACKAGE_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_PACKAGE_CERTIFICATE_BASE64 }}
          WINDOWS_PACKAGE_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_PACKAGE_CERTIFICATE_PASSWORD }}
          WINDOWS_PACKAGE_PUBLISHER: ${{ secrets.WINDOWS_PACKAGE_PUBLISHER }}
          WINDOWS_SETUP_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_PREVIEW_SETUP_CERTIFICATE_BASE64 }}
          WINDOWS_SETUP_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_PREVIEW_SETUP_CERTIFICATE_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in 'WINDOWS_PACKAGE_CERTIFICATE_BASE64', 'WINDOWS_PACKAGE_CERTIFICATE_PASSWORD', 'WINDOWS_PACKAGE_PUBLISHER', 'WINDOWS_SETUP_CERTIFICATE_BASE64', 'WINDOWS_SETUP_CERTIFICATE_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required pilot release secret(s): $($missing -join ', ')"
          }

      - name: Restore
        run: dotnet restore ViscerealityCompanion.sln

      - name: Build
        run: dotnet build ViscerealityCompanion.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ViscerealityCompanion.sln --configuration Release --no-build

      - name: Publish app
        run: >
          dotnet publish src/ViscerealityCompanion.App/ViscerealityCompanion.App.csproj
          --configuration Release
          --runtime win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          --output artifacts/app-win-x64

      - name: Publish CLI
        run: >
          dotnet publish src/ViscerealityCompanion.Cli/ViscerealityCompanion.Cli.csproj
          --configuration Release
          --runtime win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          --output artifacts/cli-win-x64

      - name: Decode signing certificate
        id: certificate
        shell: pwsh
        env:
          WINDOWS_PACKAGE_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_PACKAGE_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ViscerealityCompanion-sussex-fix-pilot-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_PACKAGE_CERTIFICATE_BASE64))
          "path=$certificatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Decode guided-setup signing certificate
        id: setup_certificate
        shell: pwsh
        env:
          WINDOWS_SETUP_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_PREVIEW_SETUP_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ViscerealityCompanion-sussex-fix-pilot-setup-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SETUP_CERTIFICATE_BASE64))
          "path=$certificatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build signed pilot package
        shell: pwsh
        env:
          WINDOWS_PACKAGE_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_PACKAGE_CERTIFICATE_PASSWORD }}
          WINDOWS_PACKAGE_PUBLISHER: ${{ secrets.WINDOWS_PACKAGE_PUBLISHER }}
          WINDOWS_PACKAGE_TIMESTAMP_URL: ${{ vars.WINDOWS_PACKAGE_TIMESTAMP_URL }}
        run: |
          $buildArgs = @(
            '-Configuration', 'Release',
            '-IdentityFlavor', 'Pilot',
            '-Version', '${{ steps.release.outputs.package_version }}',
            '-Publisher', $env:WINDOWS_PACKAGE_PUBLISHER,
            '-PublisherDisplayName', $env:PACKAGE_PUBLISHER_DISPLAY_NAME,
            '-AppInstallerUri', '${{ steps.release.outputs.appinstaller_uri }}',
            '-MainPackageUri', '${{ steps.release.outputs.package_uri }}',
            '-PackageCertificatePath', '${{ steps.certificate.outputs.path }}',
            '-PackageCertificatePassword', $env:WINDOWS_PACKAGE_CERTIFICATE_PASSWORD
          )

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_PACKAGE_TIMESTAMP_URL)) {
            $buildArgs += @('-PackageCertificateTimestampUrl', $env:WINDOWS_PACKAGE_TIMESTAMP_URL)
          }

          & powershell -ExecutionPolicy Bypass -File .\tools\app\Build-App-Package.ps1 @buildArgs

      - name: Publish pilot guided setup bootstrapper
        shell: pwsh
        env:
          WINDOWS_SETUP_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_PREVIEW_SETUP_CERTIFICATE_PASSWORD }}
          WINDOWS_PACKAGE_TIMESTAMP_URL: ${{ vars.WINDOWS_PACKAGE_TIMESTAMP_URL }}
          WINDOWS_SETUP_TIMESTAMP_URL: ${{ vars.WINDOWS_PREVIEW_SETUP_TIMESTAMP_URL }}
        run: |
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SETUP_TIMESTAMP_URL)) { $env:WINDOWS_PACKAGE_TIMESTAMP_URL } else { $env:WINDOWS_SETUP_TIMESTAMP_URL }
          & powershell -ExecutionPolicy Bypass -File .\tools\app\Publish-PreviewSetup.ps1 `
            -Version '${{ steps.release.outputs.package_version }}' `
            -FileName $env:SETUP_FILE_NAME `
            -SetupProductName $env:PACKAGE_DISPLAY_NAME `
            -SetupAppInstallerDownloadUri '${{ steps.release.outputs.appinstaller_uri }}' `
            -SetupCertificateDownloadUri '${{ steps.release.outputs.certificate_uri }}' `
            -SetupReleasePageUri '${{ steps.release.outputs.release_page_uri }}' `
            -SetupExpectedPackageId $env:PACKAGE_ID `
            -SetupDownloadDirectoryName 'ViscerealityCompanionSussexFixPilotSetup' `
            -SetupAppInstallerFileName $env:APPINSTALLER_FILE_NAME `
            -SetupCertificateFileName $env:CERTIFICATE_FILE_NAME `
            -PackageCertificatePath '${{ steps.setup_certificate.outputs.path }}' `
            -PackageCertificatePassword $env:WINDOWS_SETUP_CERTIFICATE_PASSWORD `
            -PackageCertificateTimestampUrl $timestampUrl

      - name: Validate pilot App Installer isolation
        shell: pwsh
        env:
          PILOT_TAG: ${{ steps.release.outputs.tag_name }}
          PILOT_APPINSTALLER_URI: ${{ steps.release.outputs.appinstaller_uri }}
          PILOT_PACKAGE_URI: ${{ steps.release.outputs.package_uri }}
        run: |
          [xml]$appInstaller = Get-Content "artifacts\windows-installer\$env:APPINSTALLER_FILE_NAME"
          $mainPackage = $appInstaller.AppInstaller.MainPackage
          if ($mainPackage.Name -ne $env:PACKAGE_ID) {
            throw "Pilot App Installer points at package $($mainPackage.Name), expected $env:PACKAGE_ID"
          }

          $serialized = Get-Content "artifacts\windows-installer\$env:APPINSTALLER_FILE_NAME" -Raw
          if ($serialized -match '/releases/latest/download/') {
            throw 'Pilot App Installer must not reference the mutable releases/latest feed.'
          }

          if ($appInstaller.AppInstaller.Uri -ne $env:PILOT_APPINSTALLER_URI -or $mainPackage.Uri -ne $env:PILOT_PACKAGE_URI) {
            throw 'Pilot App Installer URIs are not pinned to the immutable pilot tag.'
          }

      - name: Validate release asset signatures
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File .\tools\app\Test-ReleaseAssetSigning.ps1
          -PreviewSetupPath artifacts\windows-installer\${{ env.SETUP_FILE_NAME }}
          -PackagePath artifacts\windows-installer\${{ env.PACKAGE_FILE_NAME }}
          -AllowSelfSignedPreviewSetup
          -AllowSelfSignedPackage

      - name: Package portable pilot assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-installer | Out-Null
          Compress-Archive -Path artifacts\app-win-x64\* -DestinationPath artifacts\windows-installer\ViscerealityCompanion-SussexFixPilot-win-x64.zip
          Compress-Archive -Path artifacts\cli-win-x64\* -DestinationPath artifacts\windows-installer\viscereality-sussex-fix-pilot-cli-win-x64.zip

      - name: Write SHA256 sums
        shell: pwsh
        run: |
          $files = @(
            (Join-Path $PWD "artifacts\windows-installer\$env:SETUP_FILE_NAME"),
            (Join-Path $PWD "artifacts\windows-installer\$env:PACKAGE_FILE_NAME"),
            (Join-Path $PWD "artifacts\windows-installer\$env:APPINSTALLER_FILE_NAME"),
            (Join-Path $PWD "artifacts\windows-installer\$env:CERTIFICATE_FILE_NAME"),
            (Join-Path $PWD 'artifacts\windows-installer\ViscerealityCompanion-SussexFixPilot-win-x64.zip'),
            (Join-Path $PWD 'artifacts\windows-installer\viscereality-sussex-fix-pilot-cli-win-x64.zip')
          )

          Get-FileHash -Path $files -Algorithm SHA256 |
            ForEach-Object { '{0} *{1}' -f $_.Hash.ToLowerInvariant(), [IO.Path]::GetFileName($_.Path) } |
            Set-Content -Path (Join-Path $PWD 'artifacts\windows-installer\SHA256SUMS.txt') -Encoding utf8

      - name: Upload pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ViscerealityCompanion-sussex-fix-pilot
          path: artifacts/windows-installer

      - name: Publish immutable pilot prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          $assets = @(
            "artifacts\windows-installer\$env:SETUP_FILE_NAME",
            "artifacts\windows-installer\$env:PACKAGE_FILE_NAME",
            "artifacts\windows-installer\$env:APPINSTALLER_FILE_NAME",
            "artifacts\windows-installer\$env:CERTIFICATE_FILE_NAME",
            'artifacts\windows-installer\ViscerealityCompanion-SussexFixPilot-win-x64.zip',
            'artifacts\windows-installer\viscereality-sussex-fix-pilot-cli-win-x64.zip',
            'artifacts\windows-installer\SHA256SUMS.txt'
          )

          gh release create $env:PILOT_TAG $assets `
            --title "Viscereality Companion Sussex Fix Pilot ${{ steps.release.outputs.package_version }}" `
            --prerelease `
            --latest=false `
            --target $env:GITHUB_SHA

      - name: Remove signing certificates
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force '${{ steps.certificate.outputs.path }}' -ErrorAction SilentlyContinue
          Remove-Item -Force '${{ steps.setup_certificate.outputs.path }}' -ErrorAction SilentlyContinue
